# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: MACS3 CI non x64

# aarch64 runs natively on GitHub's free arm64 runners (no QEMU emulation).
on:
  workflow_dispatch:

jobs:
  build_job:
    runs-on: ubuntu-24.04-arm
    name: Build on ${{ matrix.arch }} with Python 3.12
    strategy:
      matrix:
        include:
          - arch: aarch64

    steps:
      - name: CPU info (fork-only measurement step)
        run: lscpu | grep -E 'Model name|^CPU\(s\)|Architecture'

      - name: Checkout MACS
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-aarch64-pip-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
              python3 -m pip install --prefer-binary -r requirements.txt;
          fi

      - name: Install MACS3
        run: |
          python3 -m pip install --no-build-isolation --no-deps .

      - name: Output versions of installed libraries
        run: |
          uname -a
          python3 -m pip freeze

      - name: Test
        run: |
          pytest --runxfail && cd test && ./cmdlinetest macs3

      - name: Archive cmdlinetest results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmdlinetest-hmmratac-results-${{ matrix.arch }}
          path: temp/macs3_run_hmmratac/
